name: Android CI + emulator test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (R8 minified + shrunk)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  emulator-test:
    needs: build
    # x86_64 Linux boots under software emulation in ~8 min; give it a
    # generous timeout instead of fighting for hardware acceleration that
    # hosted runners don't provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emulator-test the RELEASE build (R8 minified + shrunk), not the debug
      # APK: it is the binary the release pipeline signs and ships, so the
      # test validates the real artifact; and it is ~8x smaller, which
      # measurably shortens the Compose cold start that kept ANR'ing on the
      # KVM-less software emulator (runs 99/101). Log.d/[dbg] lines survive
      # R8 (no log stripping in proguard-rules.pro), and `adb install`
      # accepts the unsigned APK.
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-unsigned
          path: apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 1800
          script: bash ci/emulator-test.sh apk/app-release-unsigned.apk

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-out
          path: ci/out/
